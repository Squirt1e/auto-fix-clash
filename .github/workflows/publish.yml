name: CI & Publish

# 注意：文件名 publish.yml 必须保持不变 —— npm 的 Trusted Publisher 绑定的是
# 「仓库 + workflow 文件名」，改名会直接让 OIDC 发布失效。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验与打包，不发布（默认勾选）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 失败时把「哪些用例挂了 + 断言细节」做成注解：
      # 日志要在有权限的情况下才能看，而注解是公开可读的
      - name: 运行测试
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            {
              echo "失败用例："
              grep -E '^✖' test-output.log | sort -u | head -15
              echo "--- 断言细节 ---"
              grep -B1 -A6 'AssertionError\|Error:' test-output.log | head -50
            } > failure-summary.txt
            msg=$(head -c 3500 failure-summary.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=${{ matrix.os }} 测试失败::$msg"
            exit "$code"
          fi

  publish:
    name: 发布到 npm
    needs: test
    # 只在打 v* 标签或手动触发时发布；普通提交与 PR 只跑测试
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC：trusted publishing 与 provenance 必需
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 检查 OIDC 环境可用
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::拿不到 OIDC 令牌地址，请确认本 workflow 声明了 id-token: write"
            exit 1
          fi
          echo "OIDC 可用 ✓"

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag（$TAG）与 package.json（$PKG）不一致，已中止"
            exit 1
          fi

      # 预发布版本（如 1.0.1-rc.0）自动发到 next 标签，不影响 latest
      - name: 决定 dist-tag
        id: dist
        run: |
          V="$(node -p "require('./package.json').version")"
          if [[ "$V" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "检测到预发布版本 $V → 发布到 next 标签（latest 不受影响）"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "正式版本 $V → 发布到 latest 标签"
          fi

      # trusted publishing 要求 npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm --version

      # 手动触发且勾了 dry_run 时只做打包预演：
      # 必须先用一个临时版本号，否则 npm 会因"该版本已存在于 registry"而拒绝
      # （即使 --dry-run 也会校验），这正是上一轮 CI 失败的原因。
      - name: 打包预演（不发布）
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm version prerelease --preid=ci --no-git-tag-version
          echo "预演版本：$(node -p "require('./package.json').version")"
          npm publish --dry-run --access public --tag next

      # 发布：OIDC 自动认证，无需任何 token；--provenance 生成来源签名
      - name: 发布到 npm
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public --tag ${{ steps.dist.outputs.tag }}
