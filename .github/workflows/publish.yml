name: CI & Publish

# 注意：文件名 publish.yml 必须保持不变 —— npm 的 Trusted Publisher 绑定的是
# 「仓库 + workflow 文件名」，改名会直接让 OIDC 发布失效。
#
# 结构：test（macOS/Linux/Windows 三系统跑测试）→ pack（只在 ubuntu 打包，
# 并把产物装进临时前缀真跑一遍）→ publish（只在 ubuntu 上传这个已验证的产物）。
# 发布用的 tarball 就是 pack 产物，不会再重新构建，避免"发出去的和验过的不是一个东西"。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验与打包，不发布（默认勾选）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # 失败时把「哪些用例挂了 + 断言细节」做成注解：
      # 日志要在有权限的情况下才能看，而注解是公开可读的
      - name: 运行测试
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            {
              echo "失败用例："
              grep -E '^✖' test-output.log | sort -u | head -15
              echo "--- 断言细节 ---"
              grep -B1 -A6 'AssertionError\|Error:' test-output.log | head -50
            } > failure-summary.txt
            msg=$(head -c 3500 failure-summary.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=${{ matrix.os }} 测试失败::$msg"
            exit "$code"
          fi

  pack:
    name: 打包（ubuntu）
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 打包预演时必须换一个临时版本号，否则 npm 会因"该版本已存在于 registry"
      # 而拒绝（即使是 --dry-run 也会校验），这正是上一轮 CI 失败的原因。
      - name: 预演版本号（仅手动触发且勾选 dry_run）
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm version prerelease --preid=ci --no-git-tag-version
          echo "预演版本：$(node -p "require('./package.json').version")"

      - name: 构建并打包
        run: |
          pnpm build
          mkdir -p npm-artifact
          npm pack --pack-destination npm-artifact
          ls -l npm-artifact

      # 产物必须能独立装、独立跑：这一步能挡住 files 漏项、bin 路径写错、
      # 缺 dist、缺 shebang 之类"发出去才发现"的问题。
      - name: 校验产物可安装可运行
        run: |
          set -euo pipefail
          # 必须给绝对路径：`npm install -g npm-artifact/x.tgz` 会被 npm 当成
          # GitHub 简写 user/repo 去连 git 仓库（报 code 128），装的是空气。
          TARBALL="$PWD/$(ls npm-artifact/*.tgz | head -1)"
          echo "tarball=$TARBALL"
          PREFIX="$(mktemp -d)"
          npm install -g "$TARBALL" --prefix "$PREFIX" --no-audit --no-fund
          VERSION="$("$PREFIX/bin/afc" --version)"
          echo "装好后 afc --version → $VERSION"
          "$PREFIX/bin/afc" --help > /dev/null
          "$PREFIX/bin/afc" groups --help > /dev/null
          test -f "$PREFIX/lib/node_modules/auto-fix-clash/afc.config.yaml"
          echo "产物校验通过 ✓"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: npm-artifact/*.tgz
          if-no-files-found: error

  publish:
    name: 发布到 npm
    needs: [test, pack]
    # 只在打 v* 标签或手动触发时发布；普通提交与 PR 只跑测试与打包
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC：trusted publishing 与 provenance 必需
    steps:
      # 注意：这里刻意不写 registry-url。一旦写了，setup-node 会生成
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 于是 npm 走（空的）token 认证，OIDC 可信发布根本不接管，
      # 最终表现为 PUT 注册表 404。默认 registry 本来就是 registry.npmjs.org，
      # 不需要额外配置。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: npm-artifact

      # 堵住上面那个坑的复发。注意 _authToken 是 npm 的受保护键：
      # `npm config get` 会直接报错或返回空，唯一可靠信号是 `npm config list`
      # 里那行 `= (protected)`。
      - name: 确认没有 token 干扰 OIDC
        run: |
          set -euo pipefail
          echo "--- npm 配置里的认证项（如有）"
          npm config list 2>/dev/null | grep -iE '_authToken|NODE_AUTH_TOKEN' || echo "(无)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::环境里设置了 NODE_AUTH_TOKEN，会让 npm 走 token 认证而不是 OIDC"
            exit 1
          fi
          if npm config list 2>/dev/null | grep -qiE '_authToken'; then
            echo "::error::npm 配置里存在 _authToken，会让 npm 走 token 认证而不是 OIDC（表现为 404）"
            exit 1
          fi
          echo "registry=$(npm config get registry)"
          echo "无 token 干扰，OIDC 会接管 ✓"

      - name: 检查 OIDC 环境可用
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::拿不到 OIDC 令牌地址，请确认本 workflow 声明了 id-token: write"
            exit 1
          fi
          echo "OIDC 可用 ✓"

      # 版本以 tarball 里的 package.json 为准：发布的就是 pack 阶段验过的那个产物
      - name: 读取产物版本
        id: pkg
        run: |
          # 绝对路径：npm 会把相对路径的 .tgz 误判成 GitHub 简写 user/repo
          TARBALL="$(pwd)/$(ls npm-artifact/*.tgz | head -1)"
          V="$(tar -xOf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          echo "tarball=$TARBALL"
          echo "version=$V"
          echo "file=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 与产物版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.pkg.outputs.version }}"
          echo "tag=$TAG  产物=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag（$TAG）与产物版本（$PKG）不一致，已中止"
            exit 1
          fi

      # 预发布版本（如 1.1.0-rc.0）自动发到 next 标签，不影响 latest
      - name: 决定 dist-tag
        id: dist
        run: |
          V="${{ steps.pkg.outputs.version }}"
          if [[ "$V" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "检测到预发布版本 $V → 发布到 next 标签（latest 不受影响）"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "正式版本 $V → 发布到 latest 标签"
          fi

      # trusted publishing 要求 npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm --version

      # npm 的 OIDC 换票失败时会静默降级（源码里 "intended to never throw"），
      # 默认日志级别下只能看到一个没头没尾的 ENEEDAUTH。这里直接调换票接口，
      # 把注册表的原始拒绝原因打出来。令牌本身绝不回显。
      - name: 诊断 OIDC 换票
        run: |
          set -euo pipefail
          id_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")"
          # 令牌里的声明不是密钥（令牌本身不回显），把它们打出来：
          # npm 侧那条信任关系必须与这些值逐字匹配。
          ID_TOKEN="$id_token" node -e '
            const [, payload] = process.env.ID_TOKEN.split(".");
            const c = JSON.parse(Buffer.from(payload, "base64").toString("utf8"));
            const keys = ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"];
            for (const k of keys) console.log("claim " + k + " = " + (c[k] === undefined ? "(无)" : c[k]));
          '
          code="$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/auto-fix-clash" || true)"
          echo "换票 HTTP $code"
          node -e "
            const fs = require('fs');
            let body = {};
            try { body = JSON.parse(fs.readFileSync('/tmp/exchange.json', 'utf8')); } catch {}
            if (body.token) { console.log('换票拿到令牌（不回显）'); }
            else { console.log('原因:', body.message || body.error || JSON.stringify(body).slice(0, 400)); }
          "
          rm -f /tmp/exchange.json
          # 换票成功返回的是 201 Created（不是 200），按 2xx 判定
          case "$code" in 2*) echo "换票通过 ✓" ;; *) exit 1 ;; esac

      - name: 打包预演（不发布）
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish "${{ steps.pkg.outputs.file }}" --dry-run --access public --tag next

      # 发布：OIDC 自动认证，无需任何 token；--provenance 生成来源签名
      - name: 发布到 npm
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish "${{ steps.pkg.outputs.file }}" --provenance --access public --tag ${{ steps.dist.outputs.tag }} --loglevel=verbose
